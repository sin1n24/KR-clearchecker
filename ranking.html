}

function render(){
  const entries=rankingsData.entries||[];
  document.getElementById('entryCount').textContent=`参加者 ${entries.length}人`;
  if(rankingsData.updated){
    const d=new Date(rankingsData.updated);
    document.getElementById('updatedAt').textContent=
      `最終更新: ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  renderOverall(entries);
  renderKings(entries);
  renderItems(entries);
}

function renderOverall(entries){
  const el=document.getElementById('rankList');
  if(!entries.length){
    el.innerHTML='<div class="state-msg">まだ投稿者がいません。<br>チェッカーから「📊 結果を投稿」で参加しよう！</div>';
    return;
  }
  const sorted=[...entries].sort((a,b)=>b.total-a.total);
  el.innerHTML='';

  sorted.forEach((en,i)=>{
    const rank=i+1;
    const isHero=rank<=3;
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
    const cls=rank===1?'top1':rank===2?'top2':rank===3?'top3':'';

    // stacked bar: flex proportional to score (out of 100)
    const segs=CATS.map(c=>{
      const v=en[c]||0;
      return v>0
        ?`<div class="sb-seg" style="flex:${v};background:${CAT_INFO[c].color}" title="${CAT_INFO[c].name}: ${v}/25"></div>`
        :'';
    }).join('');
    const rem=100-(en.total||0);
    const remHtml=rem>0?`<div class="sb-seg" style="flex:${rem};background:var(--s2)"></div>`:'';

    // category counts
    const catsHtml=CATS.map(c=>
      `<span class="rc"><span class="dot" style="background:${CAT_INFO[c].color}"></span>${en[c]||0}</span>`
    ).join('');

    const div=document.createElement('div');
    div.className=`rank-item ${cls}${isHero?' rank-hero':''}`;
    div.innerHTML=`
      <div class="rank-num">${medal}</div>
      <div class="rank-body">
        <div class="rank-top-row">
          <div class="rank-handle">${escHtml(en.handle)}</div>
          <div class="rank-total">${en.total}<span>/100</span></div>
        </div>
        <div class="rank-stack">${segs}${remHtml}</div>
        <div class="rank-cats">${catsHtml}</div>
      </div>`;
    el.appendChild(div);
  });
}

function renderKings(entries){
  const el=document.getElementById('kingsGrid');
  el.innerHTML='';
  CATS.forEach(cat=>{
    const info=CAT_INFO[cat];
    const sorted=[...entries].sort((a,b)=>(b[cat]||0)-(a[cat]||0));
    const king=sorted[0];
    const score=king?(king[cat]||0):0;
    const deg=Math.round(score/25*360);
    const ringBg=`conic-gradient(${info.color} 0deg ${deg}deg, var(--s2) ${deg}deg 360deg)`;

    const div=document.createElement('div');
    div.className='king-card';
    div.style.borderTopColor=info.color;
    if(king){
      div.innerHTML=`
        <div class="king-cat" style="color:${info.color}">${info.emoji} ${info.name}</div>
        <div class="king-ring-wrap">
          <div class="king-ring" style="background:${ringBg}">
            <div class="king-ring-inner">
              <div class="king-ring-score" style="color:${info.color}">${score}<span>/25</span></div>
            </div>
          </div>
        </div>
        <div class="king-handle">${escHtml(king.handle)}</div>`;
    }else{
      div.innerHTML=`
        <div class="king-cat" style="color:${info.color}">${info.emoji} ${info.name}</div>
        <div class="king-ring-wrap">
          <div class="king-ring" style="background:var(--s2)">
            <div class="king-ring-inner">
              <div class="king-no-entry">—</div>
            </div>
          </div>
        </div>
        <div class="king-handle" style="color:var(--dim)">未投稿</div>`;
    }
    el.appendChild(div);
  });
}

function renderItems(entries){
  const el=document.getElementById('itemRates');
  el.innerHTML='';
  const n=entries.length;
  if(!n){el.innerHTML='<div class="state-msg">投稿者がいません</div>';return;}

  CATS.forEach(cat=>{
    const info=CAT_INFO[cat];
    const items=ITEMS.filter(i=>i.cat===cat).map(item=>{
      const cnt=entries.filter(en=>en.achieved&&en.achieved.includes(item.id)).length;
      return{...item,cnt,pct:n>0?cnt/n*100:0};
    });
    // 達成率の高い順にソート
    items.sort((a,b)=>b.pct-a.pct);

    const achieved=items.reduce((s,i)=>s+i.cnt,0);
    const hd=document.createElement('div');
    hd.className='cat-hd';
    hd.innerHTML=`<span style="color:${info.color}">${info.emoji}</span> ${info.name}
      <span class="cat-hd-count">延べ達成 ${achieved}件</span>`;
    el.appendChild(hd);

    items.forEach(item=>{
      const row=document.createElement('div');
      row.className='ir';
      row.innerHTML=`
        <div class="ir-label" title="${escHtml(item.text)}">${escHtml(item.text)}</div>
        <div class="ir-bar"><div class="ir-fill" style="width:${item.pct.toFixed(0)}%;background:${info.color}"></div></div>
        <div class="ir-pct">${item.pct.toFixed(0)}%<span class="ir-cnt">${item.cnt}/${n}人</span></div>`;
      el.appendChild(row);
    });
  });
}

function showTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['overall','kings','items'][i]===id);
  });
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadRankings();
</script>
</body>
</html>
