<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
:root{
  --bg:#f7f5f1;--surface:#ffffff;--s2:#f0ede8;--border:#e3ddd6;
  --battle:#3b6ef0;--battle-bg:#eff3ff;--battle-glow:rgba(59,110,240,.15);
  --make:#c98a00;  --make-bg:#fffbeb;  --make-glow:rgba(201,138,0,.15);
  --fail:#1a9e52;  --fail-bg:#f0fdf6;  --fail-glow:rgba(26,158,82,.15);
  --exp:#d93f74;   --exp-bg:#fff0f5;   --exp-glow:rgba(217,63,116,.15);
  --text:#1c1917;--dim:#78716c;
  --f:'Noto Sans JP',sans-serif;
  --fd:'Outfit',sans-serif;
  --r:12px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 16px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(59,110,240,.07) 0%,transparent 60%);
  color:var(--text);font-family:var(--f);font-size:15px;line-height:1.65;min-height:100vh;
}

/* HEADER */
header{
  padding:2.5rem 2rem 2rem;text-align:center;
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
  background:var(--surface);box-shadow:var(--sh);
}
header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 90% at 50% 110%,rgba(59,110,240,.05) 0%,transparent 70%);
  pointer-events:none;
}
.eyebrow{
  font-family:var(--fd);font-size:.72rem;letter-spacing:.3em;
  color:var(--battle);text-transform:uppercase;margin-bottom:.5rem;font-weight:600;
}
h1{
  font-family:var(--fd);font-size:clamp(1.8rem,5vw,3rem);
  font-weight:900;line-height:1.1;letter-spacing:-.03em;margin-bottom:.8rem;
}
h1 em{
  font-style:normal;
  background:linear-gradient(135deg,var(--battle) 0%,#7c3aed 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.score-panel{display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap;margin-top:.75rem;}
.score-total{
  font-family:var(--fd);font-size:3.5rem;font-weight:900;
  line-height:1;color:var(--battle);letter-spacing:-.04em;
}
.score-total .d{font-size:1.1rem;color:var(--dim);font-weight:400;font-family:var(--f);}
.score-cats{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;}
.sc{
  display:flex;align-items:center;gap:.35rem;font-size:.84rem;
  background:var(--s2);border-radius:999px;padding:.32rem .75rem;
  border:1px solid var(--border);font-weight:500;
}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* PROGRESS */
.prog-wrap{padding:.8rem 2rem .25rem;background:var(--surface);}
.prog-track{height:7px;background:var(--s2);border-radius:999px;overflow:hidden;}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,var(--battle),#7c3aed,var(--exp));
  border-radius:999px;transition:width .6s cubic-bezier(.34,1.56,.64,1);width:0%;
}
.prog-label{text-align:right;font-size:.78rem;color:var(--dim);margin-top:.3rem;font-weight:500;}

/* TOOLBAR */
.toolbar{
  display:flex;gap:.4rem;padding:.75rem 1.5rem;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);background:var(--surface);
  position:sticky;top:0;z-index:10;box-shadow:var(--sh);
}
.fb{
  background:var(--s2);border:1.5px solid var(--border);border-radius:999px;
  color:var(--dim);padding:.36rem .9rem;font-size:.84rem;font-family:var(--f);
  cursor:pointer;transition:all .18s;font-weight:500;
}
.fb:hover{border-color:var(--battle);color:var(--battle);background:var(--battle-bg);}
.fb.active{background:var(--battle);border-color:var(--battle);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(59,110,240,.3);}
.fb[data-cat="make"].active{background:var(--make);border-color:var(--make);color:#fff;box-shadow:0 2px 8px rgba(201,138,0,.3);}
.fb[data-cat="fail"].active{background:var(--fail);border-color:var(--fail);color:#fff;box-shadow:0 2px 8px rgba(26,158,82,.3);}
.fb[data-cat="exp"].active{background:var(--exp);border-color:var(--exp);color:#fff;box-shadow:0 2px 8px rgba(217,63,116,.3);}
.sp{flex:1;min-width:0;}
.tb{
  background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
  color:var(--dim);padding:.36rem .78rem;font-size:.8rem;font-family:var(--f);
  cursor:pointer;transition:all .18s;white-space:nowrap;font-weight:500;
}
.tb:hover{color:var(--text);border-color:var(--dim);background:var(--s2);}
.tb.illust-btn{border-color:rgba(124,58,237,.3);color:#7c3aed;}
.tb.illust-btn:hover{background:rgba(124,58,237,.06);border-color:#7c3aed;}
.tb.ranking-btn{border-color:rgba(26,158,82,.3);color:var(--fail);}
.tb.ranking-btn:hover{background:var(--fail-bg);border-color:var(--fail);}

/* DATA ROW */
.data-row{
  display:flex;gap:.75rem;padding:.6rem 1.5rem;
  background:var(--s2);border-bottom:1px solid var(--border);
  flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--dim);
}
.data-row label{cursor:pointer;transition:color .15s;font-weight:500;}
.data-row label:hover{color:var(--battle);}
.data-row input[type=file]{display:none;}
.dl{color:var(--battle);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:500;}
.dl:hover{opacity:.75;}
.danger-btn{
  background:none;border:1.5px solid #fca5a5;border-radius:7px;
  color:#ef4444;padding:.25rem .65rem;font-size:.78rem;
  font-family:var(--f);cursor:pointer;transition:all .15s;font-weight:500;
}
.danger-btn:hover{background:#fef2f2;border-color:#ef4444;}
.st{font-size:.78rem;}

/* GRID */
.main{padding:1.5rem 2rem;max-width:1200px;margin:0 auto;}
.cat-sec{margin-bottom:2.5rem;}
.cat-sec.hidden{display:none;}
.cat-hd{
  display:flex;align-items:center;gap:.65rem;
  margin-bottom:.9rem;padding-bottom:.6rem;
  border-bottom:2px solid var(--border);
}
.cat-badge{
  font-size:.76rem;font-weight:700;letter-spacing:.04em;
  padding:.26rem .75rem;border-radius:999px;border:2px solid;
}
.cat-sub{font-size:.84rem;color:var(--dim);font-weight:500;}
.item-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}

.card{
  border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--surface);padding:.75rem .6rem;
  cursor:pointer;transition:transform .15s,border-color .18s,background .18s,box-shadow .2s;
  user-select:none;min-height:82px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;-webkit-tap-highlight-color:transparent;
  box-shadow:var(--sh);
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shm);border-color:#b0a89e;}
.card:active{transform:scale(.96);}
.card[data-cat="battle"]{border-color:rgba(59,110,240,.22);}
.card[data-cat="make"]  {border-color:rgba(201,138,0,.22);}
.card[data-cat="fail"]  {border-color:rgba(26,158,82,.22);}
.card[data-cat="exp"]   {border-color:rgba(217,63,116,.22);}
.card.achieved[data-cat="battle"]{background:var(--battle-bg);border-color:var(--battle);box-shadow:0 0 0 1.5px var(--battle),var(--sh);}
.card.achieved[data-cat="make"]  {background:var(--make-bg);  border-color:var(--make);  box-shadow:0 0 0 1.5px var(--make),var(--sh);}
.card.achieved[data-cat="fail"]  {background:var(--fail-bg);  border-color:var(--fail);  box-shadow:0 0 0 1.5px var(--fail),var(--sh);}
.card.achieved[data-cat="exp"]   {background:var(--exp-bg);   border-color:var(--exp);   box-shadow:0 0 0 1.5px var(--exp),var(--sh);}
.card-text{font-size:clamp(.72rem,1.15vw,.84rem);line-height:1.5;color:var(--dim);}
.card.achieved .card-text{color:var(--text);font-weight:700;}

/* PC拡張 */
@media(min-width:900px){
  .item-grid{gap:12px;}
  .card{min-height:90px;padding:.85rem .7rem;}
  .card-text{font-size:.86rem;}
}

/* タブレット */
@media(max-width:768px){
  body{font-size:14px;}
  header{padding:1.5rem 1rem 1.2rem;}
  h1{font-size:clamp(1.5rem,6vw,2rem);}
  .score-total{font-size:2.8rem;}
  .main{padding:1rem;}
  .toolbar{padding:.55rem 1rem;gap:.3rem;}
  .data-row{padding:.5rem 1rem;}
  .item-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
  .card{min-height:74px;padding:.55rem .45rem;}
  .card-text{font-size:.73rem;}
}

/* スマホ */
@media(max-width:480px){
  .item-grid{grid-template-columns:repeat(2,1fr);gap:6px;}
  .card{min-height:70px;}
  .sc{font-size:.76rem;padding:.28rem .6rem;}
}

/* ILLUSTRATION OVERLAY */
#illustOverlay{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(247,245,241,.97);backdrop-filter:blur(6px);
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding:1.5rem;overflow-y:auto;
}
#illustOverlay.open{display:flex;}
.illust-modal-hd{
  width:100%;max-width:540px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;
}
.illust-modal-hd h2{font-size:1.05rem;font-weight:700;color:var(--text);}
.illust-modal-hd span{font-size:.8rem;color:var(--dim);}
.illust-close{
  background:var(--s2);border:1.5px solid var(--border);border-radius:8px;
  color:var(--dim);padding:.35rem .9rem;font-size:.82rem;
  font-family:var(--f);cursor:pointer;font-weight:500;transition:all .15s;
}
.illust-close:hover{color:var(--text);background:var(--border);}
.illust-canvas-wrap{
  position:relative;width:100%;max-width:540px;aspect-ratio:1;
  border:1.5px solid var(--border);border-radius:16px;overflow:hidden;
  background:#faf8f5;box-shadow:var(--shm);
}
#illustCanvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
#maskLayer{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);
  pointer-events:none;
}
.mask-block{background:#f7f5f1;}
@keyframes blockDrop{
  0%  {transform:translateY(0);opacity:1;}
  15% {transform:translateY(-8%);opacity:1;}
  100%{transform:translateY(130%);opacity:0;}
}
.mask-block.reveal{animation:blockDrop 0.38s ease-in forwards;}
.illust-hint{margin-top:.75rem;font-size:.8rem;color:var(--dim);text-align:center;max-width:540px;}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(140%);
  background:var(--text);color:#fff;
  border-radius:12px;padding:.7rem 1.3rem;
  font-size:.9rem;font-weight:700;z-index:400;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.18);
  pointer-events:none;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* CRACKER */
.cracker-piece{position:fixed;pointer-events:none;z-index:450;border-radius:50%;animation:crackerFly var(--dur) ease-out forwards;}
@keyframes crackerFly{
  0%  {opacity:1;transform:translate(0,0) scale(1) rotate(0deg);}
  80% {opacity:.9;}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.1) rotate(var(--rot));}
}

/* MILESTONE */
#msOverlay{display:none;position:fixed;inset:0;z-index:500;pointer-events:none;overflow:hidden;}
#msOverlay.active{display:block;}
.ms-bg{position:absolute;inset:0;background:rgba(28,25,23,.82);animation:msBgF 3.5s ease-out forwards;}
@keyframes msBgF{0%{opacity:1}65%{opacity:1}100%{opacity:0}}
.ms-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:msFlash .5s ease-out forwards;}
@keyframes msFlash{0%{opacity:.9}100%{opacity:0}}
.ms-ring{
  position:absolute;top:50%;left:50%;width:10px;height:10px;
  border-radius:50%;border:3px solid var(--battle);
  transform:translate(-50%,-50%) scale(0);animation:msRing 1.2s ease-out forwards;
}
.ms-ring:nth-child(3){animation-delay:.15s;border-color:#7c3aed;}
.ms-ring:nth-child(4){animation-delay:.3s;border-color:var(--exp);}
@keyframes msRing{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(70);opacity:0}}
.ms-particle{position:absolute;animation:msPart var(--pd) ease-out forwards;}
@keyframes msPart{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.ms-scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 1px,transparent 1px,transparent 4px);
  animation:msScanF 1.5s ease-out forwards;
}
@keyframes msScanF{0%{opacity:.7}100%{opacity:0}}
.ms-banner{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.4);text-align:center;
  opacity:0;animation:msBannerIn .5s .2s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes msBannerIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ms-banner.out{animation:msBannerOut .4s ease-in forwards;}
@keyframes msBannerOut{to{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
.ms-num{
  font-family:var(--fd);font-size:clamp(4rem,18vw,8rem);font-weight:900;line-height:1;
  background:linear-gradient(135deg,#fff 0%,var(--battle) 50%,var(--exp) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 30px rgba(59,110,240,.8));letter-spacing:-.04em;
}
.ms-label{
  font-family:var(--fd);font-size:clamp(1rem,4vw,1.8rem);font-weight:900;
  color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5);margin-top:.3rem;letter-spacing:.05em;
}
.ms-sub{font-size:clamp(.75rem,2.5vw,1rem);color:rgba(255,255,255,.75);margin-top:.4rem;}

/* CONFIRM */
#confirmOverlay{
  display:none;position:fixed;inset:0;
  background:rgba(28,25,23,.55);backdrop-filter:blur(4px);
  z-index:600;align-items:center;justify-content:center;padding:1rem;
}
#confirmOverlay.open{display:flex;}
.confirm-box{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:18px;padding:2rem;width:100%;max-width:360px;
  text-align:center;box-shadow:var(--shm);
}
.confirm-box h3{font-size:1.1rem;margin-bottom:.6rem;font-weight:700;}
.confirm-box p{font-size:.88rem;color:var(--dim);margin-bottom:1.5rem;line-height:1.65;}
.confirm-actions{display:flex;gap:.6rem;justify-content:center;}
.c-btn{
  background:var(--s2);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);padding:.55rem 1.4rem;font-size:.88rem;
  font-family:var(--f);cursor:pointer;font-weight:500;transition:all .15s;
}
.c-btn:hover{background:var(--border);}
.c-btn.danger{background:#ef4444;border-color:#ef4444;color:#fff;font-weight:700;}
.c-btn.danger:hover{background:#dc2626;}

/* SHARE */
#shareModal{
  display:none;position:fixed;inset:0;
  background:rgba(28,25,23,.55);backdrop-filter:blur(4px);
  z-index:100;align-items:center;justify-content:center;padding:1rem;
}
#shareModal.open{display:flex;}
.modal-box{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:18px;padding:1.75rem;width:100%;max-width:480px;
  box-shadow:var(--shm);
}
.modal-box h2{font-size:1.05rem;margin-bottom:.9rem;font-weight:700;}
.share-text{
  background:var(--s2);border:1.5px solid var(--border);border-radius:10px;
  padding:1rem;font-size:.85rem;line-height:1.75;
  white-space:pre-wrap;margin-bottom:1rem;color:var(--text);
}
.modal-actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;}
.mbtn{
  background:var(--s2);border:1.5px solid var(--border);border-radius:8px;
  color:var(--text);padding:.48rem 1rem;font-size:.84rem;
  font-family:var(--f);cursor:pointer;font-weight:500;transition:all .15s;
}
.mbtn:hover{background:var(--border);}
.mbtn.p{background:var(--battle);border-color:var(--battle);color:#fff;font-weight:700;}
.mbtn.p:hover{opacity:.88;}
.mbtn.tw{background:#1d9bf0;border-color:#1d9bf0;color:#fff;font-weight:700;}
.mbtn.tw:hover{opacity:.88;}

footer{
  text-align:center;padding:2.5rem;font-size:.8rem;color:var(--dim);
  border-top:1px solid var(--border);line-height:2;background:var(--surface);
}
footer a{color:var(--dim);text-underline-offset:2px;}
footer a:hover{color:var(--battle);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Kawasaki Robot Competition 2026</div>
  <h1>かわロボ<br><em>クリアチェッカー</em></h1>
  <div class="score-panel">
    <div class="score-total"><span id="totalCount">0</span><span class="d"> / 100</span></div>
    <div class="score-cats">
      <div class="sc"><div class="dot" style="background:#4a7cf5"></div>戦績 <strong id="c_battle">0</strong>/25</div>
      <div class="sc"><div class="dot" style="background:#f5c842"></div>制作 <strong id="c_make">0</strong>/25</div>
      <div class="sc"><div class="dot" style="background:#5ecb6e"></div>やらかし <strong id="c_fail">0</strong>/25</div>
      <div class="sc"><div class="dot" style="background:#e8609a"></div>経験その他 <strong id="c_exp">0</strong>/25</div>
    </div>
  </div>
</header>

<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <div class="prog-label" id="progLabel">0%</div>
</div>

<div class="toolbar">
  <button class="fb active" data-cat="all"    onclick="setFilter('all')">すべて</button>
  <button class="fb" data-cat="battle" onclick="setFilter('battle')">⚔️ 戦績</button>
  <button class="fb" data-cat="make"   onclick="setFilter('make')">🔧 制作</button>
  <button class="fb" data-cat="fail"   onclick="setFilter('fail')">💥 やらかし</button>
  <button class="fb" data-cat="exp"    onclick="setFilter('exp')">🌟 経験その他</button>
  <div class="sp"></div>
  <button class="tb illust-btn" onclick="openIllust()">🖼 全体を見る</button>
  <button class="tb" onclick="openShare()">📢 シェア</button>
  <button class="tb ranking-btn" onclick="submitRanking()">📊 結果を投稿</button>
  <a class="tb" href="ranking.html" target="_blank" style="text-decoration:none;color:var(--dim);">🏆 ランキング</a>
</div>

<div class="data-row">
  <span>データ：</span>
  <span class="dl" onclick="exportJSON()">⬇ JSON書き出し</span>
  <label>⬆ JSON読込<input type="file" id="jsonInput" accept=".json" onchange="handleJSONImport(event)"></label>
  <label>📥 Excel取込<input type="file" id="xlsxInput" accept=".xlsx" onchange="handleXLSXImport(event)"></label>
  <div class="sp"></div>
  <button class="danger-btn" onclick="confirmReset()">🗑 リセット</button>
  <span class="st" id="dataStatus"></span>
</div>

<div class="main" id="mainContent"></div>

<footer>
  評価期間：2026年1月1日〜12月上旬（立命杯終了が目安）<br>
  企画：<a href="https://note.com/jolly_roses919/n/n93ba68eadac8" target="_blank">下剋上(かわロボ)</a>

// ================================================================
// STATE
// ================================================================
let achieved=new Set(), currentFilter='all', lastMilestone=0;
const SK='kr_checker_v4';
function loadState(){try{const s=localStorage.getItem(SK);if(s)achieved=new Set(JSON.parse(s));}catch(e){}}
function saveState(){try{localStorage.setItem(SK,JSON.stringify([...achieved]));}catch(e){}}

// ================================================================
// ILLUSTRATION
// item_id → block position (10x10 grid of 5x5-pixel blocks)
// ================================================================
function itemToBlock(id){
  if(id<25) return [Math.floor(id/5), id%5];
  if(id<50){const i=id-25; return [Math.floor(i/5), 5+i%5];}
  if(id<75){const i=id-50; return [5+Math.floor(i/5), i%5];}
  const i=id-75; return [5+Math.floor(i/5), 5+i%5];
}

// offscreen canvas — full pixel art rendered once
const OFF=document.createElement('canvas');
OFF.width=500; OFF.height=500;
const OFFCTX=OFF.getContext('2d');

function buildOffscreen(){
  // draw each pixel as 10x10 square
  for(let i=0;i<2500;i++){
    const px=PIXELS[i];
    OFFCTX.fillStyle=(px==='w')?'#f5f0eb':px;
    const row=Math.floor(i/50), col=i%50;
    OFFCTX.fillRect(col*10, row*10, 10, 10);
  }
}

// Draw full illustration onto visible canvas
function drawIllustCanvas(){
  const cv=document.getElementById('illustCanvas');
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,500,500);
  ctx.drawImage(OFF,0,0);
}

// Build the 10x10 mask grid (100 divs, one per item/block)
// Initially: achieved blocks visible (no mask), unachieved blocks masked
function buildMaskLayer(){
  const layer=document.getElementById('maskLayer');
  layer.innerHTML='';
  for(let br=0;br<10;br++){
    for(let bc=0;bc<10;bc++){
      const div=document.createElement('div');
      div.className='mask-block';
      div.id=`mb_${br}_${bc}`;
      // 全ブロック初期状態は真っ黒。アニメーションで落下して消える
      layer.appendChild(div);
    }
  }
}

function blockToItem(br,bc){
  if(br<5 && bc<5)  return br*5+bc;           // 戦績
  if(br<5 && bc>=5) return 25+(br*5+(bc-5));  // 制作
  if(br>=5 && bc<5) return 50+((br-5)*5+bc);  // やらかし
  return 75+((br-5)*5+(bc-5));                 // 経験その他
}

// When illust opens: blocks crack and fall away left→right, top→bottom
function animateMaskReveal(){
  const scanOrder=[];
  for(let br=0;br<10;br++){
    for(let bc=0;bc<10;bc++){
      const itemId=blockToItem(br,bc);
      if(itemId!==null && achieved.has(itemId)){
        scanOrder.push({br,bc});
      }
    }
  }
  const total=scanOrder.length;
  if(total===0) return;
  // 1枚ずつ割れて落ちる感が出るよう間隔を空ける
  // 各アニメが0.45s → 次を0.18s後に始めると「割れてる最中に次が始まる」自然なテンポ
  // ただし全体が長くなりすぎないよう上限3.5s
  const perBlock=Math.min(180, Math.floor(3500/total));

  scanOrder.forEach(({br,bc},idx)=>{
    const delay=idx*perBlock;
    const div=document.getElementById(`mb_${br}_${bc}`);
    if(!div) return;
    setTimeout(()=>{ div.classList.add('reveal'); }, delay);
  });
}

// Tiny particle burst at a mask block's screen position
function miniCrackerAt(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const colors=ALL_COLORS;
  for(let i=0;i<6;i++){
    const p=document.createElement('div');
    p.className='cracker-piece';
    const angle=Math.random()*Math.PI*2;
    const dist=20+Math.random()*50;
    const tx=Math.cos(angle)*dist;
    const ty=Math.sin(angle)*dist;
    const dur=(0.3+Math.random()*0.3)+'s';
    p.style.cssText=`left:${cx}px;top:${cy}px;width:5px;height:5px;background:${colors[Math.floor(Math.random()*colors.length)]};--tx:${tx}px;--ty:${ty}px;--dur:${dur};--rot:${Math.random()*360}deg;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}

function openIllust(){
  drawIllustCanvas();
  buildMaskLayer();
  document.getElementById('illustOverlay').classList.add('open');
  updateIllustHint();
  // start reveal after paint settles
  setTimeout(animateMaskReveal, 120);
}
function closeIllust(){

}
function updateIllustHint(){
  const t=achieved.size;
  document.getElementById('illustHint').textContent=
    t===0?'まだ何も解放されていません。チェックを積み重ねよう！':
    t<20?`${t}/100 解放中 — まだ霧の中…`:
    t<50?`${t}/100 解放 — だいぶ見えてきた`:
    t<80?`${t}/100 解放 — もう少し！`:
    t<100?`${t}/100 解放 — ほぼコンプリート！`:'🎉 100/100 完全解放！';
}

// ================================================================
// BUILD UI
// ================================================================
function buildUI(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  ['battle','make','fail','exp'].forEach(cat=>{
    const info=CAT[cat];
    const sec=document.createElement('div');
    sec.className='cat-sec'; sec.dataset.cat=cat;
    sec.innerHTML=`<div class="cat-hd">
      <span class="cat-badge" style="color:${info.color};border-color:${info.color}">${info.emoji} ${info.name}</span>
      <span class="cat-sub" id="cl_${cat}"></span></div>
      <div class="item-grid" id="grid_${cat}"></div>`;
    main.appendChild(sec);
    const grid=sec.querySelector('.item-grid');
    ITEMS.filter(i=>i.cat===cat).forEach(item=>{
      const c=document.createElement('div');
      c.className='card'+(achieved.has(item.id)?' achieved':'');
      c.dataset.cat=cat; c.dataset.id=item.id;
      c.innerHTML=`<div class="card-text">${item.text}</div>`;
      c.addEventListener('click',()=>toggle(item.id,cat));
      grid.appendChild(c);
    });
  });
  updateScores();
  applyFilter(currentFilter);
}

function toggle(id,cat){
  const was=achieved.has(id);
  if(was){achieved.delete(id);}else{achieved.add(id);}
  saveState();
  const c=document.querySelector(`.card[data-id="${id}"]`);
  if(c) c.classList.toggle('achieved',!was);
  updateScores();
  if(!was){
    showToast(ITEMS[id].text);
    fireCracker(cat);
    checkMilestone();
  }
}

function updateScores(){
  const t=achieved.size;
  document.getElementById('totalCount').textContent=t;
  const pct=(t*100/100).toFixed(0);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLabel').textContent=pct+'%';
  ['battle','make','fail','exp'].forEach(cat=>{
    const cnt=ITEMS.filter(i=>i.cat===cat&&achieved.has(i.id)).length;
    document.getElementById('c_'+cat).textContent=cnt;
    const l=document.getElementById('cl_'+cat);
    if(l) l.textContent=`${cnt}/25 達成`;
  });
}

// ================================================================
// FILTER
// ================================================================
function setFilter(cat){
  currentFilter=cat;
  document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  applyFilter(cat);
}
function applyFilter(cat){
  document.querySelectorAll('.cat-sec').forEach(s=>
    s.classList.toggle('hidden',cat!=='all'&&s.dataset.cat!==cat));
}

// ================================================================
// TOAST
// ================================================================
let toastTimer;
function showToast(text){
  const el=document.getElementById('toast');
  const s=text.length>22?text.slice(0,22)+'…':text;
  el.textContent='✅ '+s+' 達成！';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}

// ================================================================
// CRACKER — left AND right, category color
// ================================================================
function fireCracker(cat){
  const color=CAT[cat].color;
  const vy=window.innerHeight*0.42;
  spawnCrackerSide(0,        vy, color,  1);
  spawnCrackerSide(window.innerWidth, vy, color, -1);
}
function spawnCrackerSide(ox,oy,mainColor,dir){
  const N=28;
  for(let i=0;i<N;i++){
    const el=document.createElement('div');
    el.className='cracker-piece';
    // fan angle pointing inward
    const baseAngle=dir===1?-15:-165;
    const angle=(baseAngle+(Math.random()-0.5)*100)*Math.PI/180;
    const dist=110+Math.random()*220;
    const tx=Math.cos(angle)*dist;
    const ty=Math.sin(angle)*dist-Math.random()*40;
    const dur=(0.45+Math.random()*0.55)+'s';
    const rot=(Math.random()*720-360)+'deg';
    const color=Math.random()<0.4?mainColor:ALL_COLORS[Math.floor(Math.random()*ALL_COLORS.length)];
    const size=5+Math.random()*8;
    el.style.cssText=`left:${ox}px;top:${oy}px;width:${size}px;height:${size}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${color};--tx:${tx}px;--ty:${ty}px;--dur:${dur};--rot:${rot};animation-delay:${Math.random()*.15}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
}

// ================================================================
// MILESTONE
// ================================================================
function checkMilestone(){
  const t=achieved.size;
  for(const m of MILESTONES){
    if(t>=m&&lastMilestone<m){lastMilestone=m;showMilestone(m);break;}
  }
}
function showMilestone(n){
  const [label,sub]=MS_MSG[n];
  const ov=document.getElementById('msOverlay');
  ov.innerHTML=''; ov.classList.add('active');
  ['ms-bg','ms-flash','ms-scan'].forEach(cl=>{const d=document.createElement('div');d.className=cl;ov.appendChild(d);});
  for(let i=0;i<3;i++){const r=document.createElement('div');r.className='ms-ring';ov.appendChild(r);}
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='ms-particle';
    const a=(i/80)*Math.PI*2, d=100+Math.random()*300;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${4+Math.random()*12}px;height:${4+Math.random()*12}px;border-radius:${Math.random()>.5?'50%':'3px'};background:${ALL_COLORS[Math.floor(Math.random()*ALL_COLORS.length)]};--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--pd:${.8+Math.random()*.7}s;animation-delay:${Math.random()*.4}s;`;
    ov.appendChild(p);
  }
  for(let i=0;i<6;i++) setTimeout(()=>{fireCracker('battle');fireCracker('exp');},i*200);
  const b=document.createElement('div'); b.className='ms-banner';
  b.innerHTML=`<div class="ms-num">${n}</div><div class="ms-label">${label}</div><div class="ms-sub">${sub}</div>`;
  ov.appendChild(b);
  const DUR=n===100?5000:3500;
  setTimeout(()=>{b.classList.add('out');setTimeout(()=>{ov.classList.remove('active');ov.innerHTML='';},500);},DUR-500);
  ov.style.pointerEvents='auto';
  ov.addEventListener('click',()=>{ov.classList.remove('active');ov.innerHTML='';},{once:true});
}

// ================================================================
// DATA
// ================================================================
function setDataStatus(msg,ok=true){
  const el=document.getElementById('dataStatus');
  el.style.color=ok?'#5ecb6e':'#e05555';
  el.textContent=msg;
  setTimeout(()=>el.textContent='',3500);
}
function exportJSON(){
  const data={version:2,exported:new Date().toISOString(),achieved:[...achieved],total:achieved.size};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`kr-checker2026_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  setDataStatus('✅ JSONを書き出しました');
}
function handleJSONImport(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.achieved||!Array.isArray(d.achieved)) throw new Error('フォーマットが違います');
      d.achieved.forEach(id=>{if(id>=0&&id<100)achieved.add(id);});
      saveState(); buildUI();
      setDataStatus(`✅ ${achieved.size}件を復元しました`);
    }catch(err){setDataStatus('エラー: '+err.message,false);}
  };
  r.readAsText(f); e.target.value='';
}
function handleXLSXImport(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=new Uint8Array(ev.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets['チェッカー'];
      if(!ws) throw new Error('「チェッカー」シートが見つかりません');
      const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const texts=new Set();
      for(let r2=2;r2<json.length;r2+=2){
        const ir=json[r2], sr=json[r2+1]||[];
        for(let c=0;c<ir.length;c++) if(sr[c]==='達成') texts.add(String(ir[c]).trim());
      }
      let imported=0;
      ITEMS.forEach(item=>{
        const n=item.text.replace(/\s+/g,' ').trim();
        for(const t of texts){
          if(t.replace(/\s+/g,' ').trim().slice(0,8)===n.slice(0,8)&&!achieved.has(item.id)){
            achieved.add(item.id); imported++;
          }
        }
      });
      saveState(); buildUI();
      setDataStatus(`✅ ${imported}件取込しました`);
    }catch(err){setDataStatus('エラー: '+err.message,false);}
  };
  r.readAsArrayBuffer(f); e.target.value='';
}

// ================================================================
// RANKING SUBMIT
// ================================================================
const GAS_URL='https://script.google.com/macros/s/AKfycbwCuKjzz8q03CvQ8fiMR7Qlj83LI_kz2ta4K5eBUvmKJloBqN8RPmn9SgSxNU5Wocwy/exec';

function submitRanking(){
  if(achieved.size===0){showToast('⚠️ まだ何も達成していません');return;}
  const handle=prompt('ハンドル名を入力してください\n（X/SNSアカウント名など、半角20文字以内）');
  if(!handle||!handle.trim()) return;
  const h=handle.trim().slice(0,20);
  const cats={};
  ['battle','make','fail','exp'].forEach(c=>cats[c]=ITEMS.filter(i=>i.cat===c&&achieved.has(i.id)).length);
  if(GAS_URL.includes('YOUR_DEPLOY_ID')){showToast('⚠️ GAS URLが未設定です（管理者向け）');return;}
  const payload={handle:h,total:achieved.size,...cats,achieved:[...achieved]};
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
    .then(r=>r.json())
    .then(d=>{if(d.ok)showToast('📊 ランキングに投稿しました！');else showToast('⚠️ 投稿エラー: '+d.error);})
    .catch(()=>showToast('⚠️ 投稿に失敗しました。再試行してください'));
}

buildOffscreen();
loadState();
MILESTONES.forEach(m=>{if(achieved.size>=m)lastMilestone=m;});
